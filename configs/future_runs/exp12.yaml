train:
  max_updates: 200002
  val_every_updates: 10000
  log_every_updates: 500
  val_iterative: false
  val_iterative_steps: 64
  val_iterative_teacher_force: true
  val_iterative_parallel: false
  use_tqdm: true
  seed: 39
  deterministic: false
  compile:
    enabled: false
    mode: reduce-overhead
    fullgraph: false
  batch_size: 64
  val_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 16
  val_num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  images_only: true
  return_properties: false
  max_samples_train: null
  max_samples_val: 2000
  max_val_batches: 20
  grad_clip_norm: 1.0
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  lr_schedule:
    type: cosine
    warmup_steps: 10000
    min_lr: 1.0e-6
  ema:
    enabled: false
    rate: 0.9999
    use_for_val: false
  ckpt:
    every_updates: 10000
    keep_last: 1
    resume_path: null
    resume_latest: true
  amp: true
  amp_dtype: "bfloat16"
  dino_cache:
    enabled: false
    dir: ./data/coco/dino_cache
    skip_image_loading: true
    backend: lmdb
    lmdb_map_size_gb: 256

data:
  dataset: coco
  root: ./data/coco
  image_size: 256
  max_objects: 60
  train_split: train2017
  val_split: val2017
  min_area: 0.0
  train_horizontal_flip_prob: 0.5

dino:
  size: b
  freeze: true
  compile: false

slots:
  num_iterations: 5
  num_slots: 7
  num_heads: 1
  slot_size: 512
  input_size: null
  out_size: null
  mlp_hidden_size: 2048
  truncate: fixed-point
  qk_rmsnorm: false
  qk_rmsnorm_eps: 1.0e-6
  rope: {}
  init_mode: gaussian
  kmeans_iters: 10

mar:
  model_dim: 768
  encoder_depth: 0
  decoder_depth: 4
  num_heads: 6
  mlp_hidden_dim: 3072
  dropout: 0.0
  self_attn_type: full # 'full' or 'causal'
  prediction_order: random
  predict_tokens: null
  buffer_size: 64
  register_slots: 64
  slot_conditioned: false
  slot_conditional_depth: 2
  slot_conditional_dropout: 0.0
  slot_conditional_qk_norm: false
  slot_conditional_embed: true
  add_pos_to_known: false
  qk_norm: false
  use_bos_token: true
  pos_embed_type: mlp  # 'learned' (like original MAR) or 'mlp'
  max_seq_len: 256  # max sequence length for learned positional embeddings

masking:
  strategy: order  # 'order' or 'slot_conditioned'
  ratio_min: 0.7
  ratio_max: 1.0
  ratio_mode: uniform  # 'truncated_gaussian' (like original MAR) or 'uniform'
  ratio_std: 0.25  # std dev for truncated Gaussian (centered at ratio_max)

mask_matching:
  enabled: true
  lambda_start: 0.0
  lambda_end: 0.1
  lambda_warmup_steps: 0
  lambda_ramp_steps: 40000

wandb:
  enabled: true
  project: slot-dino
  entity: null
  run_name: mar_coco_mask0.7_1.0_Bdino_mlppos_registerslots_maskmatch_noencoder
  mode: online

output:
  dir: runs
