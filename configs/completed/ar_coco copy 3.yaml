model:
  type: ar

train:
  max_updates: 150002
  val_every_updates: 10000
  log_every_updates: 500
  val_iterative: false
  val_iterative_steps: 64
  val_iterative_teacher_force: true
  val_iterative_parallel: false
  use_tqdm: true
  seed: 39
  deterministic: false
  compile:
    enabled: false
    mode: reduce-overhead
    fullgraph: false
  batch_size: 64
  val_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 8
  val_num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  images_only: true
  return_properties: false
  max_samples_train: null
  max_samples_val: 2000
  max_val_batches: 20
  grad_clip_norm: 1.0
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  lr_schedule:
    type: cosine
    warmup_steps: 10000
    min_lr: 1.0e-6
  ema:
    enabled: false
    rate: 0.9999
    use_for_val: false
  ckpt:
    every_updates: 10000
    keep_last: 1
    resume_path: null
    resume_latest: false
  amp: true
  amp_dtype: "bfloat16"
  dino_cache:
    enabled: false
    dir: ./data/coco/dino_cache
    skip_image_loading: true
    backend: lmdb
    lmdb_map_size_gb: 256

data:
  dataset: coco
  root: ./data/coco
  image_size: 256
  max_objects: 60
  train_split: train2017
  val_split: val2017
  min_area: 0.0
  train_horizontal_flip_prob: 0.5

dino:
  version: v3
  variant: vitb16
  freeze: true
  compile: false

slots:
  num_iterations: 5
  num_slots: 7
  num_heads: 1
  slot_size: 512
  input_size: null
  out_size: null
  mlp_hidden_size: 2048
  truncate: fixed-point
  qk_rmsnorm: false
  qk_rmsnorm_eps: 1.0e-6
  rope: {}
  init_mode: gaussian
  kmeans_iters: 10

ar:
  model_dim: 768
  encoder_depth: 0
  decoder_depth: 4
  num_heads: 6
  mlp_hidden_dim: 3072
  slot_cross_mlp: false
  dropout: 0.0
  self_attn_type: causal
  prediction_order: raster  # 'random' or 'raster'
  random_order_prob_start: 1.0  # Initial probability that a training sample uses a random token order instead of raster order.
  random_order_prob_start_step: 50000  # First training step where the random-order probability starts changing away from `random_order_prob_start`.
  random_order_prob_end: 0.0  # Final probability that a training sample uses a random token order after the schedule finishes.
  random_order_prob_end_step: 100000  # Training step where the random-order schedule reaches `random_order_prob_end`.
  buffer_size: 64
  register_slots: 64
  slot_conditioned: false  # Runs slot-conditioned attention blocks that let slots and ordered token inputs interact before decoding.
  slot_conditional_depth: 2  # Number of slot-conditioned attention blocks to apply when `slot_conditioned` is enabled.
  slot_conditional_dropout: 0.0  # Dropout used inside the slot-conditioned attention blocks.
  slot_conditional_qk_norm: false  # Enables query/key normalization inside the slot-conditioned attention blocks for more stable attention scores.
  slot_conditional_embed: false  # Adds a learned slot-mixture embedding to each autoregressive token input based on slot-attention assignments.
  qk_norm: false
  use_bos_token: true
  pos_embed_type: mlp
  max_seq_len: 256

mask_matching:
  enabled: true
  loss_type: bce  # bce | soft_ce | kl
  lambda_start: 0.0
  lambda_end: 0.005
  coeff_by_loss:
    bce: 1.0
    soft_ce: 0.211340206185567
    kl: 10.0
  lambda_warmup_steps: 0
  lambda_ramp_steps: 40000

wandb:
  enabled: true
  project: slot-ar
  entity: null
  run_name: ar_coco_B_0.005_mask_matching_no_slot_mixture_raster
  mode: online

output:
  dir: runs
